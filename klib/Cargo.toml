[package]
name = "klib"
version = "0.1.0"
edition = "2024"
description = "가상 관계형 자료함 엔진 klib.exe"
license = "MIT"
publish = false

[dependencies]
rusqlite = { version = "0.33", features = ["bundled"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
tantivy = "0.27"
md5 = "0.7"
regex = "1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
default = []
# ko-dic(lindera)은 사전 다운로드 서버가 없어졌고 의존성 취약점(GitLab 보안 검사)으로 제거(11-06). 사전 확보 뒤 다시 넣는다.
