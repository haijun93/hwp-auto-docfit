[package]
name = "klib"
version = "0.1.0"
edition = "2024"
description = "가상 관계형 자료함 엔진 klib.exe"
license = "MIT"
publish = false

[dependencies]
rusqlite = { version = "0.33", features = ["bundled"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
tantivy = "=0.22.1"
md5 = "0.7"
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
