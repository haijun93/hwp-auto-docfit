stages:
  - test
  - release
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .cache/pip/

validate-source:
  stage: test
  tags:
    - security-deploy
  before_script:
    - python --version
    - python -m pip install --disable-pip-version-check --break-system-packages defusedxml
  script:
    - python -m py_compile hwp-auto-docfit.py
    - python -m unittest tests.test_hwpx_core tests.test_kordoc_bridge -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

release-windows:
  stage: release
  tags:
    - security-deploy
  script:
    - test -f release-assets/HWP_AutoDocFit.exe
    - mkdir -p dist
    - cp release-assets/HWP_AutoDocFit.exe dist/HWP_AutoDocFit.exe
    # 한 번에 적용 시험용 보고서 예시(텍스트)도 함께 내려받게 한다(2026-10-04 사용자 요청).
    - cp "release-assets/보고서 예시 파일(한번에 적용).txt" "dist/보고서 예시 파일(한번에 적용).txt"
    - sha256sum dist/HWP_AutoDocFit.exe
    # 압축팩(exe+예시)은 GitHub 릴리스에만 둔다. exe가 50MB를 넘으며 exe·압축팩을 함께 올리면 GitLab 첨부 한도(100MB)를
    # 넘어 작업이 실패했다(v1.73 첫 태그, 2026-10-11). GitLab에는 exe와 예시 텍스트만 올린다.
    - |
      if [ -f "releases/$CI_COMMIT_TAG.md" ]; then
        release_notes="releases/$CI_COMMIT_TAG.md"
      else
        printf '%s\n' 'Windows 테스트 베타 릴리스입니다. 운영 환경 적용 전 충분히 테스트해 주세요.' > release-notes.txt
        release_notes="release-notes.txt"
      fi
      curl --silent --show-error --request DELETE \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$CI_COMMIT_TAG" || true
      curl --fail-with-body --request POST \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --data-urlencode "tag_name=$CI_COMMIT_TAG" \
        --data-urlencode "name=한글편집 후처리 $CI_COMMIT_TAG" \
        --data-urlencode "description@$release_notes" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
    - |
      curl --fail-with-body --request POST \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --data-urlencode "name=보고서 예시 파일(한번에 적용).txt" \
        --data-urlencode "url=$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/raw/dist/%EB%B3%B4%EA%B3%A0%EC%84%9C%20%EC%98%88%EC%8B%9C%20%ED%8C%8C%EC%9D%BC%28%ED%95%9C%EB%B2%88%EC%97%90%20%EC%A0%81%EC%9A%A9%29.txt" \
        --data-urlencode "link_type=other" \
        --data-urlencode "direct_asset_path=/report-example-all-in-one.txt" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$CI_COMMIT_TAG/assets/links"
    - |
      curl --fail-with-body --request POST \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --data-urlencode "name=HWP_AutoDocFit.exe" \
        --data-urlencode "url=$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/raw/dist/HWP_AutoDocFit.exe" \
        --data-urlencode "link_type=other" \
        --data-urlencode "direct_asset_path=/HWP_AutoDocFit.exe" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$CI_COMMIT_TAG/assets/links"
  artifacts:
    name: "HWP_AutoDocFit-$CI_COMMIT_TAG"
    paths:
      - "dist/HWP_AutoDocFit.exe"
      - "dist/보고서 예시 파일(한번에 적용).txt"
  rules:
    - if: '$CI_COMMIT_TAG'

create-pages:
  stage: deploy
  needs: []
  tags:
    - security-deploy
  script:
    - mkdir -p public
    - cp -r website/. public/
  pages: true
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
