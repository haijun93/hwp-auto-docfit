stages:
  - test
  - release
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .cache/pip/

validate-source:
  stage: test
  tags:
    - security-deploy
  before_script:
    - python --version
    - python -m pip install --disable-pip-version-check --break-system-packages defusedxml
  script:
    - python -m py_compile hwp-auto-docfit.py
    - python -m unittest tests.test_hwpx_core tests.test_kordoc_bridge -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

release-windows:
  stage: release
  tags:
    - security-deploy
  script:
    - test -f release-assets/HWP_AutoDocFit.exe
    - mkdir -p dist
    - cp release-assets/HWP_AutoDocFit.exe dist/HWP_AutoDocFit.exe
    - sha256sum dist/HWP_AutoDocFit.exe
    - |
      curl --fail-with-body --request POST \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --data-urlencode "tag_name=$CI_COMMIT_TAG" \
        --data-urlencode "name=HWP Auto DocFit $CI_COMMIT_TAG" \
        --data-urlencode "description=HWP Auto DocFit Windows 공식 릴리스입니다. 고급 문서 도구는 Node.js 18 이상이 필요합니다." \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
    - |
      curl --fail-with-body --request POST \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --data-urlencode "name=HWP_AutoDocFit.exe" \
        --data-urlencode "url=$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/raw/dist/HWP_AutoDocFit.exe" \
        --data-urlencode "link_type=package" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$CI_COMMIT_TAG/assets/links"
  artifacts:
    name: "HWP_AutoDocFit-$CI_COMMIT_TAG"
    paths:
      - dist/HWP_AutoDocFit.exe
  rules:
    - if: '$CI_COMMIT_TAG'

create-pages:
  stage: deploy
  needs: []
  tags:
    - security-deploy
  script:
    - mkdir -p public
    - cp -r website/. public/
  pages: true
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
