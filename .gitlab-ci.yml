stages:
  - test
  - release
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .cache/pip/

validate-source:
  stage: test
  tags:
    - security-deploy
  before_script:
    - python --version
    - python -m pip install --disable-pip-version-check --break-system-packages defusedxml
  script:
    - python -m py_compile hwp-auto-docfit.py
    - python -m unittest tests.test_hwpx_core tests.test_kordoc_bridge -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

release-windows:
  stage: release
  tags:
    - security-deploy
  script:
    - test -f release-assets/HWP_AutoDocFit.exe
    - mkdir -p dist
    - cp release-assets/HWP_AutoDocFit.exe dist/HWP_AutoDocFit.exe
    - sha256sum dist/HWP_AutoDocFit.exe
  artifacts:
    name: "HWP_AutoDocFit-$CI_COMMIT_TAG"
    paths:
      - dist/HWP_AutoDocFit.exe
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "HWP Auto DocFit $CI_COMMIT_TAG"
    description: "HWP Auto DocFit의 Windows 공식 릴리스입니다."
    assets:
      links:
        - name: "HWP_AutoDocFit.exe"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/raw/dist/HWP_AutoDocFit.exe"
          link_type: "package"
  rules:
    - if: '$CI_COMMIT_TAG'

create-pages:
  stage: deploy
  needs: []
  tags:
    - security-deploy
  script:
    - mkdir -p public
    - cp -r website/. public/
  pages: true
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
