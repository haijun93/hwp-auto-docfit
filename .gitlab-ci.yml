stages:
  - test
  - release
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .cache/pip/

validate-source:
  stage: test
  tags:
    - security-deploy
  before_script:
    - python --version
    - python -m pip install --disable-pip-version-check --break-system-packages defusedxml
  script:
    - python -m py_compile hwp-auto-docfit.py
    - python -m unittest tests.test_hwpx_core tests.test_kordoc_bridge -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# GitLab 릴리스 페이지 동기화(2026-11-04): exe가 200MB를 넘어 GitLab 첨부·산출물 한도를 넘기므로
# 파일은 올리지 않고, 릴리스 노트(releases/vX.md)와 내려받기 링크(GitHub 릴리스·GitLab downloads 브랜치)만 등록한다.
# 태그 파이프라인뿐 아니라 main 파이프라인에서도 돌아 빠진 버전 릴리스를 채운다(이미 있으면 건너뜀).
sync-releases:
  stage: release
  tags:
    - security-deploy
  variables:
    GIT_DEPTH: "0"
  script:
    - git fetch --tags --force --quiet origin || true
    - |
      latest=$(git tag -l 'v2.*' --sort=-v:refname | grep -v -- '-rc' | head -1)
      for tag in $(git tag -l 'v2.*' --sort=-v:refname | head -40); do
        notes="releases/$tag.md"
        if [ ! -f "$notes" ]; then
          git show "$tag:releases/$tag.md" > /tmp/notes.md 2>/dev/null || continue
          notes=/tmp/notes.md
        fi
        version=${tag#v}
        code=$(curl --silent --output /tmp/release.out --write-out '%{http_code}' --request POST \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --data-urlencode "tag_name=$tag" \
          --data-urlencode "name=HWP AutoDocFit $version" \
          --data-urlencode "description@$notes" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases")
        if [ "$code" != 201 ]; then echo "$tag: 건너뜀(HTTP $code)"; continue; fi
        echo "$tag: 릴리스 등록"
        for kind in Portable Setup; do
          name="HWP_AutoDocFit_v${version}_${kind}.exe"
          curl --silent --show-error --request POST --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            --data-urlencode "name=$name (GitHub)" \
            --data-urlencode "url=https://github.com/haijun93/hwp-auto-docfit/releases/download/$tag/$name" \
            --data-urlencode "link_type=package" \
            "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$tag/assets/links" > /dev/null
          if [ "$tag" = "$latest" ]; then
            curl --silent --show-error --request POST --header "JOB-TOKEN: $CI_JOB_TOKEN" \
              --data-urlencode "name=$name (GitLab 내려받기)" \
              --data-urlencode "url=$CI_PROJECT_URL/-/raw/downloads/$name?inline=false" \
              --data-urlencode "link_type=package" \
              "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$tag/assets/links" > /dev/null
          fi
        done
      done
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

create-pages:
  stage: deploy
  needs: []
  tags:
    - security-deploy
  script:
    - mkdir -p public
    - cp -r website/. public/
  pages: true
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
