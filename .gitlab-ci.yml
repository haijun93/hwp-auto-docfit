stages:
  - test
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .cache/pip/

validate-windows:
  stage: test
  tags:
    - windows
  before_script:
    - python --version
    - python -m pip install --disable-pip-version-check -r requirements.txt
  script:
    - python -m py_compile hwp-auto-docfit.py
    - python -c "import runpy; runpy.run_path('hwp-auto-docfit.py', run_name='import_check')"
    - python -m unittest discover -s tests -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

release-windows:
  stage: release
  tags:
    - windows
  before_script:
    - python --version
    - python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller
  script:
    - python -m unittest discover -s tests -v
    - python -m PyInstaller --noconfirm --clean --onefile --windowed --name HWP_AutoDocFit --add-data "MapoHwpAutoDocFitSecurity.dll;." --collect-all tkinterdnd2 --collect-all PIL --hidden-import PIL.Image --hidden-import PIL.ImageTk --hidden-import PIL.ImageOps hwp-auto-docfit.py
  artifacts:
    name: "HWP_AutoDocFit-$CI_COMMIT_TAG"
    paths:
      - dist/HWP_AutoDocFit.exe
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "HWP Auto DocFit $CI_COMMIT_TAG"
    description: "HWP Auto DocFit의 Windows 공식 릴리스입니다."
    assets:
      links:
        - name: "HWP_AutoDocFit.exe"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/raw/dist/HWP_AutoDocFit.exe"
          link_type: "package"
  rules:
    - if: '$CI_COMMIT_TAG'
