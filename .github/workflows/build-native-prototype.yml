name: Build Flutter Windows native prototype
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: diagram_editor/package-lock.json
      - name: Install backend build dependencies
        run: python -m pip install -c constraints.txt -r requirements.txt pyinstaller
      - name: Test independent services and protocol
        run: python -m unittest tests.test_configuration_service tests.test_native_ipc tests.test_process_lock
      - name: Build separate prototype bundle
        shell: pwsh
        run: ./build_native.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HWP_AutoDocFit-native-prototype
          path: |
            dist-native/prototype/
            dist-native/SHA256SUMS.txt
          if-no-files-found: error
