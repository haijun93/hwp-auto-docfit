name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches:
      - claude/add-letter-spacing-script
    paths:
      - ".github/workflows/build-windows-exe.yml"
      - "hwp auto letter spacing.py"
      - "FilePathCheckerModuleExample.dll"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyinstaller pywin32

      - name: Build executable
        run: pyinstaller --onefile --name "LineFit_v0.1" "hwp auto letter spacing.py"

      - name: Assemble release package
        run: |
          mkdir package
          copy dist\LineFit_v0.1.exe package\
          copy FilePathCheckerModuleExample.dll package\

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: LineFit_v0.1_windows
          path: package/

      - name: Publish package to git branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B exe-artifact-v0.1
          git add -f package/LineFit_v0.1.exe package/FilePathCheckerModuleExample.dll
          git commit -m "Build LineFit v0.1 Windows executable"
          git push -f origin exe-artifact-v0.1
