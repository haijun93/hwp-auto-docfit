name: Build Windows exe

on:
  push:
    branches:
      - claude/affectionate-goldberg-ggln7c
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Check Pillow image support
        run: python -c "from PIL import Image, ImageTk, ImageOps; print('Pillow', Image.__version__)"

      - name: Build HWP_AutoDocFit.exe
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name HWP_AutoDocFit
          --add-data "MapoHwpAutoDocFitSecurity.dll;."
          --collect-all tkinterdnd2
          --collect-all PIL
          --hidden-import PIL.Image
          --hidden-import PIL.ImageTk
          --hidden-import PIL.ImageOps
          hwp-auto-docfit.py

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: HWP_AutoDocFit-exe
          path: dist/HWP_AutoDocFit.exe
          if-no-files-found: error

      - name: Commit built exe to release-assets
        shell: bash
        run: |
          cp dist/HWP_AutoDocFit.exe release-assets/HWP_AutoDocFit.exe
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release-assets/HWP_AutoDocFit.exe
          if git diff --cached --quiet; then
            echo "No change in built exe; skipping commit."
          else
            git commit -m "Update built HWP_AutoDocFit.exe from CI run ${{ github.run_id }}"
            git push origin HEAD:${{ github.ref_name }}
          fi
