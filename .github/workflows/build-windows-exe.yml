name: Build Windows exe

on:
  push:
    branches:
      - alpha
      - claude/affectionate-goldberg-ggln7c
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Check Pillow image support
        run: python -c "from PIL import Image, ImageTk, ImageOps; print('Pillow', Image.__version__)"

      - name: Validate alpha source and regression tests
        if: github.ref == 'refs/heads/alpha'
        run: |
          python -m py_compile hwp-auto-docfit.py docfit_core/batch_format.py
          python -m unittest discover -s tests

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Build Flutter interface
        shell: pwsh
        run: ./build_flutter.ps1

      - name: Build HWP_AutoDocFit.exe
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name HWP_AutoDocFit
          --add-data "MapoHwpAutoDocFitSecurity.dll;."
          --add-data "desktop_web;desktop_web"
          --add-data "resources;resources"
          --collect-all tkinterdnd2
          --collect-all PIL
          --collect-all webview
          --collect-all pythonnet
          --collect-all clr_loader
          --hidden-import PIL.Image
          --hidden-import PIL.ImageTk
          --hidden-import PIL.ImageOps
          hwp-auto-docfit.py

      - name: Upload exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'alpha' && 'HWP_AutoDocFit-alpha' || 'HWP_AutoDocFit-binaries' }}
          path: |
            dist/HWP_AutoDocFit.exe
          if-no-files-found: error

      - name: Commit built exes to release-assets
        if: github.ref != 'refs/heads/alpha'
        shell: bash
        run: |
          cp dist/HWP_AutoDocFit.exe release-assets/HWP_AutoDocFit.exe
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release-assets/HWP_AutoDocFit.exe
          if git diff --cached --quiet; then
            echo "No change in built exes; skipping commit."
          else
            git commit -m "Update built exes from CI run ${{ github.run_id }}"
            git push origin HEAD:${{ github.ref_name }}
          fi
