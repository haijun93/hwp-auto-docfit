name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches:
      - claude/add-letter-spacing-script
    paths:
      - ".github/workflows/build-windows-exe.yml"
      - "hwp_auto_docfit.py"
      - "FilePathCheckerModuleExample.dll"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyinstaller pywin32 tkinterdnd2 pyhwpx

      - name: Build executable
        run: pyinstaller --onefile --windowed --collect-all tkinterdnd2 --collect-all pyhwpx --name "HWP_Auto_DocFit_v4.1" "hwp_auto_docfit.py"

      - name: Assemble release package
        run: |
          mkdir package
          copy dist\HWP_Auto_DocFit_v4.1.exe package\
          copy FilePathCheckerModuleExample.dll package\

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: HWP_Auto_DocFit_v4.1_windows
          path: package/

      - name: Publish package to git branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B exe-artifact-v4.1
          git add -f package/HWP_Auto_DocFit_v4.1.exe package/FilePathCheckerModuleExample.dll
          git commit -m "Build HWP Auto DocFit v4.1 Windows executable"
          git push -f origin exe-artifact-v4.1
