# 태그(vX.Y-beta.N)를 푸시하면 GitHub 릴리스를 만든다(2026-10-04).
# 그전에는 GitLab CI만 릴리스를 만들어 GitHub 릴리스가 v1.69-beta.3에 멈춰 있었다.
# 노트는 releases/<태그>.md, 메인 exe는 태그 커밋의 release-assets/HWP_AutoDocFit.exe(CI 빌드 cherry-pick본)를 쓴다.
name: GitHub release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify fresh build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          test -s release-assets/build-source.txt
          SOURCE=$(cat release-assets/build-source.txt)
          git merge-base --is-ancestor "$SOURCE" HEAD
          git diff --exit-code "$SOURCE" HEAD -- . ':(exclude)release-assets' ':(exclude)releases' ':(exclude)HANDOVER.md' ':(exclude)README.md' ':(exclude)website'
          if test -f release-assets/build-delivery.json; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
            test "$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)" = "$SOURCE"
            gh release download "$TAG" --pattern HWP_AutoDocFit.exe --dir release-assets
          fi
          sha256sum --check release-assets/SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTE="releases/${TAG}.md"
          [ -f "$NOTE" ] || { echo "노트 없음: $NOTE"; exit 1; }
          TITLE="$(head -1 "$NOTE" | sed 's/^# *//')"
          if gh release view "$TAG" >/dev/null 2>&1 && ! test -f release-assets/build-delivery.json; then
            echo "이미 있는 릴리스: $TAG"
          else
            # GitHub는 첨부 파일 이름의 한글을 지우므로(default.txt가 됨) 영문 이름으로 올리고 한글은 표시 이름(#)으로 둔다.
            cp "release-assets/보고서 예시 파일(한번에 적용).txt" report-example-all-in-one.txt
            python3 -c "import zipfile, os; tag=os.environ.get('TAG', 'release'); z=zipfile.ZipFile(f'HWP_AutoDocFit-{tag}.zip', 'w', zipfile.ZIP_DEFLATED); z.write('release-assets/HWP_AutoDocFit.exe', 'HWP_AutoDocFit.exe'); os.path.exists('release-assets/보고서 예시 파일(한번에 적용).txt') and z.write('release-assets/보고서 예시 파일(한번에 적용).txt', '보고서 예시 파일(한번에 적용).txt'); z.close()"
            if test -f release-assets/build-delivery.json; then
              gh release upload "$TAG" "HWP_AutoDocFit-${TAG}.zip" release-assets/SHA256SUMS "report-example-all-in-one.txt#보고서 예시 파일(한번에 적용).txt" --clobber
              gh release edit "$TAG" --draft=false --title "$TITLE" --notes-file "$NOTE" --latest
            else
              gh release create "$TAG" "HWP_AutoDocFit-${TAG}.zip" release-assets/HWP_AutoDocFit.exe release-assets/SHA256SUMS "report-example-all-in-one.txt#보고서 예시 파일(한번에 적용).txt" --title "$TITLE" --notes-file "$NOTE" --latest
            fi
          fi
