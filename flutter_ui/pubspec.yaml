name: docfit_ui
description: HWP AutoDocFit alpha desktop interface
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  web: ^1.1.1
  webview_flutter_windows: 1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/NotoSansKR.ttf
  assets:
    - assets/flow_editor/
    - assets/flow_editor/assets/
    - assets/diagram_editor/
    - assets/diagram_editor/assets/
    - assets/hwp_preview/
    - assets/hwp_preview/assets/
